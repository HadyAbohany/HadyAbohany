<?xml version="1.0" encoding="UTF-8"?>
<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 490 330"
width="490"
height="330">

<style>

    .bg {
        fill: #0d1117;
    }

    .border {
        fill: none;
        stroke: #30363d;
        stroke-width: 1;
    }

    .title {
        font-family: monospace;
        font-size: 15px;
        font-weight: bold;
        fill: #58a6ff;
    }

    .key {
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #79c0ff;
        opacity: 0;
        animation: keyIn 0.3s ease-out forwards;
    }

    .value {
        font-family: monospace;
        font-size: 14px;
        fill: #8b949e;
    }

    .prompt {
        font-family: monospace;
        font-size: 13px;
        fill: #7ee787;
    }

    .cursor {
        fill: #7ee787;
    }

    @keyframes keyIn {
        from {
            opacity: 0;
            transform: translateX(-6px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
    }

</style>

<rect
    x="0"
    y="0"
    width="100%"
    height="100%"
    rx="10"
    class="bg"
/>

<rect
    x="0.5"
    y="0.5"
    width="489"
    height="329"
    rx="10"
    class="border"
/>

<!-- Terminal header -->

<circle cx="18" cy="18" r="5" fill="#ff5f56"/>
<circle cx="35" cy="18" r="5" fill="#ffbd2e"/>
<circle cx="52" cy="18" r="5" fill="#27c93f"/>

<text
