<svg
xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 490 330"
width="490"
height="330">

<style>

    .bg {
        fill: #0d1117;
    }

    .border {
        fill: none;
        stroke: #30363d;
        stroke-width: 1;
    }

    .title {
        font-family: monospace;
        font-size: 15px;
        font-weight: bold;
        fill: #58a6ff;
    }

    .key {
        font-family: monospace;
        font-size: 14px;
        font-weight: bold;
        fill: #79c0ff;
    }

    .value {
        font-family: monospace;
        font-size: 14px;
        fill: #8b949e;
    }

    .prompt {
        font-family: monospace;
        font-size: 13px;
        fill: #7ee787;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateX(-8px);
        }

        to {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .line {
        opacity: 0;
        animation: fadeIn 0.45s ease-out forwards;
    }

</style>

<rect
    x="0"
    y="0"
    width="100%"
    height="100%"
    rx="10"
    class="bg"
/>

<rect
    x="0.5"
    y="0.5"
    width="489"
    height="329"
    rx="10"
    class="border"
/>

<!-- Terminal header -->

<circle cx="18" cy="18" r="5" fill="#ff5f56"/>
<circle cx="35" cy="18" r="5" fill="#ffbd2e"/>
<circle cx="52" cy="18" r="5" fill="#27c93f"/>

<text
    x="75"
    y="23"
    class="title"
>
    hady@github ~
</text>

<!-- Prompt -->

<text
    x="25"
    y="58"
    class="prompt"
>
    $ whoami
</text>

<text
    x="25"
    y="86"
    class="title"
>
    Hady Abohany
</text>

<g
    class="line"
    style="animation-delay: 0.00s;"
>

    <text
        x="25"
        y="120"
        class="key"
    >
        name:
    </text>

    <text
        x="125"
        y="120"
        class="value"
    >
        Hady Abohany
    </text>

</g>

<g
    class="line"
    style="animation-delay: 0.12s;"
>

    <text
        x="25"
        y="147"
        class="key"
    >
        role:
    </text>

    <text
        x="125"
        y="147"
        class="value"
    >
        AI Engineer
    </text>

</g>

<g
    class="line"
    style="animation-delay: 0.24s;"
>

    <text
        x="25"
        y="174"
        class="key"
    >
        focus:
    </text>

    <text
        x="125"
        y="174"
        class="value"
    >
        RAG • LLMs • AI Agents
    </text>

</g>

<g
    class="line"
    style="animation-delay: 0.36s;"
>

    <text
        x="25"
        y="201"
        class="key"
    >
        stack:
    </text>

    <text
        x="125"
        y="201"
        class="value"
    >
        Python • LangChain • FastAPI
    </text>

</g>

<g
    class="line"
    style="animation-delay: 0.48s;"
>

    <text
        x="25"
        y="228"
        class="key"
    >
        db:
    </text>

    <text
        x="125"
        y="228"
        class="value"
    >
        PostgreSQL • ChromaDB
    </text>

</g>

<g
    class="line"
    style="animation-delay: 0.60s;"
>

    <text
        x="25"
        y="255"
        class="key"
    >
        current:
    </text>

    <text
        x="125"
        y="255"
        class="value"
    >
        Building AI systems
    </text>

</g>

<g
    class="line"
    style="animation-delay: 0.72s;"
>

    <text
        x="25"
        y="282"
        class="key"
    >
        education:
    </text>

    <text
        x="125"
        y="282"
        class="value"
    >
        Systems & Computers Engineering
    </text>

</g>

</svg>
