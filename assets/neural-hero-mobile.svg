<path d="M32 16H448" stroke="#B8ECFF" stroke-opacity=".35"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="34" y="58" fill="#69E0F4" font-size="13" letter-spacing="3">AI ENGINEERING</text>
<text x="32" y="111" fill="#F3F8FF" font-size="42" font-weight="700" letter-spacing="-1">Hady Abohany</text>
<text x="34" y="148" fill="#BCD0E5" font-size="22">AI Engineer</text>
<text x="34" y="185" fill="#BCD0E5" font-size="15">LLMs · Retrieval · AI backends</text>
<text x="34" y="272" fill="#69E0F4" font-size="13" letter-spacing="2">EVIDENCE. TOOLS. CONTEXT.</text>
