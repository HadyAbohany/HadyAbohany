<text x="46" y="246" fill="#BCD0E5" font-size="18">LLMs · Retrieval · Agents · AI backends</text>
<text x="46" y="288" fill="#69E0F4" font-size="12" letter-spacing="2.6">EVIDENCE. TOOLS. CONTEXT.</text>
