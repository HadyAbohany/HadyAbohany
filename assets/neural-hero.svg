<path d="M32 16H928" stroke="#B8ECFF" stroke-opacity=".35"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="46" y="65" fill="#69E0F4" font-size="13" letter-spacing="3.2">APPLIED INTELLIGENCE / AI ENGINEERING</text>
<text x="43" y="139" fill="#F3F8FF" font-size="57" font-weight="700" letter-spacing="-1.5">Hady Abohany</text>
