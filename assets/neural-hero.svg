<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="title desc">
<title id="title">Hady Abohany — AI Engineer</title>
<desc id="desc">A navy glass panel and cyan neural lattice. Building AI systems around evidence, tools and context. Decorative signals move briefly, then stop.</desc>
